version: 1
id: chrome
name: Google Chrome

roots:
  - name: user-data
    path: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"

include:
  - "Default/Preferences"
  - "Default/Secure Preferences"
  - "Default/Local Extension Settings/**"
  - "Default/Bookmarks"
  - "Profile */Preferences"
  - "Profile */Secure Preferences"
  - "Profile */Local Extension Settings/**"
  - "Profile */Bookmarks"
