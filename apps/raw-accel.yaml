version: 1
id: raw-accel
name: Raw Accel

roots:
  - name: user-data
    path:
      - "%PROGRAMFILES%\\Raw Accel"
      - "%LOCALAPPDATA%\\Programs\\RawAccel"
      - "C:\\Programs\\RawAccel"
    evidence:
      any:
        - file: "settings.json"
        - file: ".config"

include:
  - "settings.json"
  - ".config"
