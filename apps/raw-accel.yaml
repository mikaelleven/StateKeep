version: 1
id: raw-accel
name: Raw Accel

roots:
  - name: installation
    path: "%PROGRAMFILES%\\Raw Accel"
    evidence:
      any:
        - file: "settings.json"
        - file: ".config"

  - name: programs
    path: "C:\\Programs\\RawAccel"
    evidence:
      any:
        - file: "settings.json"
        - file: ".config"

  - name: local-programs
    path: "%LOCALAPPDATA%\\Programs\\RawAccel"
    evidence:
      any:
        - file: "settings.json"
        - file: ".config"

include:
  - "settings.json"
  - ".config"
