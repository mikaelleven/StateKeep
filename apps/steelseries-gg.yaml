version: 1
id: steelseries-gg
name: SteelSeries GG

roots:
  - name: user-data
    path:
      - "%APPDATA%\\SteelSeries\\GG"
      - "%LOCALAPPDATA%\\SteelSeries\\GG"
      - "%PROGRAMDATA%\\SteelSeries\\GG"

exclude:
  - "Cache/**"
  - "Logs/**"
  - "Crashpad/**"
  - "apps/sonar/audio_samples/**"
  - "shared/externalAppIcons/**"
  - "apps/engine/updates/**"
  - "apps/engine/assets/loadoutImages/**"
  - "**/database.db-shm"
  - "**/database.db-wal"
  - "*.exe"
  - "apps/moments/*.gif"
  - "apps/engine/SSE2Bypass.reg"
